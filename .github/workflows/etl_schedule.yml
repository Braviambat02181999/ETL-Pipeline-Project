name: Automated E-Commerce ETL Pipeline

on:
  schedule:
    # Berjalan otomatis setiap hari jam 00:00 UTC (jam 07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan kita menjalankan pipeline secara manual lewat tombol

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run ETL Pipeline Script
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python main.py
